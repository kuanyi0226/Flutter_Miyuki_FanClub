  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #ce75c5;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #flutter-app {
      width: min(100%, 700px);
      height: 100%;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      overscroll-behavior: none;
    }
    html.home-layout { background: #11131c; }
    body.home-layout { background: transparent; }
    #flutter-app.home-layout {
      width: 100%;
      background: linear-gradient(135deg, #242036, #11131c);
    }
    #home-snow { position: fixed; z-index: 10; inset: 0; overflow: hidden; pointer-events: none; }
    #home-snow span {
      position: absolute;
      top: -12px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: #faf4ff;
      opacity: .6;
      animation: home-snowfall var(--duration) var(--delay) linear infinite;
    }
    @keyframes home-snowfall {
      to { transform: translate3d(var(--drift), calc(100vh + 24px), 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #home-snow span { animation-play-state: paused; }
    }
  </style>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="flutter-app"></div>
  <div id="home-snow" aria-hidden="true" hidden></div>
  <script src="home-snow.js?v=20261127-home-3"></script>
  <script>
    window.addEventListener('load', () => {
      const loader = _flutter.loader;
      const config = { hostElement: document.getElementById('flutter-app') };
      const onEntrypointLoaded = async (engineInitializer) => {
        const appRunner = await engineInitializer.initializeEngine(config);
        await appRunner.runApp();
        document.getElementById('splash')?.remove();
      };

      // Older Flutter builds expose only loadEntrypoint.
      if (loader.load && _flutter.buildConfig) {
        loader.load({ config, onEntrypointLoaded });
      } else {
        loader.loadEntrypoint({
          entrypointUrl: 'main.dart.js?v=20261127-home-4',
          onEntrypointLoaded,
        });
      }
    });
  </script>
</body>
